[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "redops-agent-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "redops-contracts==0.1.0",
    "psycopg[binary]>=3.2,<4",
    "opentelemetry-api>=1.27,<2",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
test = ["mypy>=1.11,<3", "opentelemetry-sdk>=1.27,<2", "pytest>=8,<10"]

[project.scripts]
redops-agent-runtime = "supervisor:main"

[tool.uv.sources]
redops-contracts = { path = "../../packages/contracts-py" }

[tool.setuptools]
py-modules = ["supervisor"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["harness", "workers", "skills", "skills.*"]

[tool.setuptools.package-data]
skills = ["*/skill.yaml", "*/prompt.md", "*/examples/*.json"]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/contracts-py"]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../packages/contracts-py"
exclude = ['^(\./)?build/']
