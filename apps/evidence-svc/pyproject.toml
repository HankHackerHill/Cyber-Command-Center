[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "redops-evidence-svc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "redops-contracts==0.1.0",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "mypy>=1.11", "pytest>=8"]

# Run uvicorn main:app on the trusted service network. EVIDENCE_ROOT is a
# private local filesystem directory for both the objects and their link index.
# DATABASE_URL needs SELECT on findings and immutable_audit_log.
# Tests use a disposable EVIDENCE_TEST_DATABASE_URL with schema creation rights.
[tool.uv.sources]
redops-contracts = { path = "../../packages/contracts-py" }

[tool.setuptools]
py-modules = ["main", "store", "ledger_link"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ['^(\./)?build/']
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../packages/contracts-py"
