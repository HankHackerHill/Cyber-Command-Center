[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "redops-report-svc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "redops-contracts==0.1.0",
    "cryptography>=43",
    "cvss==3.6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1.6,<4",
    "uvicorn>=0.30,<1",
    "weasyprint==69.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.11", "pypdf>=5,<8"]

[tool.uv.sources]
redops-contracts = { path = "../../packages/contracts-py" }

# Run uvicorn main:app on the private service network. The module docstring
# documents the source URLs, trust store and operator-provisioned inputs.
# PDF reproducibility requires the same Pango, fontconfig and DejaVu fonts.

[tool.setuptools]
py-modules = ["main", "render"]
packages = ["mappers", "templates"]

[tool.setuptools.package-data]
templates = ["*.j2"]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/contracts-py"]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../packages/contracts-py"
exclude = ['^(\./)?build/']
